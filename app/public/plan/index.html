    const INITIAL_APPROVALS = [

    const INITIAL_EMPLOYEES = [
      { id: "EMP-01", name: "Alex Rivera", department: "Operations & Procurement", role: "Operations Manager", salary: 85000, status: "Active", attendance: "On-Shift" },
      { id: "EMP-02", name: "Maria Santos", department: "Revenue & Sales", role: "Senior Sales Lead", salary: 78000, status: "Active", attendance: "Remote" },
      { id: "EMP-03", name: "Sarah Jenkins", department: "Software Engineering", role: "Staff Engineer", salary: 110000, status: "Active", attendance: "On-Shift" },
      { id: "EMP-04", name: "David Chen", department: "Finance & Accounting", role: "Controller", salary: 92000, status: "Active", attendance: "On-Shift" }
    ];

    /* Storage Keys */
    const SPEC_STORAGE_KEY = "NEXUS_BMS_SRS_SPEC_V3";
    const APP_STATE_KEY = "NEXUS_BMS_LIVE_APP_STATE_V1";

    /* =========================================================================
       HELPER FORMATTERS
       ========================================================================= */
    function formatCurrency(amount, branch) {
      if (amount === null || amount === undefined) return "—";
      const converted = amount * branch.rate;
      if (branch.currency === "JPY") {
        return `${branch.symbol}${Math.round(converted).toLocaleString()}`;
      }
      return `${branch.symbol}${converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    /* =========================================================================
       MAIN ROOT CONTAINER COMPONENT
       ========================================================================= */
    function NexusRoot() {
      // Living SRS Spec State
      const [spec, setSpec] = useState(() => {
        try {
          // Clean up legacy v1 and v2 cached storage if present
          if (localStorage.getItem("NEXUS_BMS_SRS_SPEC_V1")) localStorage.removeItem("NEXUS_BMS_SRS_SPEC_V1");
          if (localStorage.getItem("NEXUS_BMS_SRS_SPEC_V2")) localStorage.removeItem("NEXUS_BMS_SRS_SPEC_V2");
          const saved = localStorage.getItem(SPEC_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            // Verify version matches current code build version, otherwise refresh to latest INITIAL_SPEC_DATA
            if (parsed.meta?.version === INITIAL_SPEC_DATA.meta?.version) {
              return parsed;
            }
          }
          return INITIAL_SPEC_DATA;
        } catch (e) {
          return INITIAL_SPEC_DATA;
        }
      });

      // App Mode: "live" (Operational Application) or "spec" (Engineering Blueprint)
      const [appMode, setAppMode] = useState("live");
      const [specTab, setSpecTab] = useState("overview");
      const [editSpecMode, setEditSpecMode] = useState(false);
      const [searchSpecQuery, setSearchSpecQuery] = useState("");
      const [selectedSpecCat, setSelectedSpecCat] = useState("All");
      const [newModuleModalOpen, setNewModuleModalOpen] = useState(false);
      const [activeModuleForReq, setActiveModuleForReq] = useState(null);

      // Theme State (Dark / Light)
      const [isDark, setIsDark] = useState(() => {
        return document.documentElement.classList.contains("dark") || true;
      });

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [isDark]);

      // Global Live App State
      const [branch, setBranch] = useState(BRANCHES[0]);
      const [role, setRole] = useState(ROLES[0]);
      const [activeAppModule, setActiveAppModule] = useState("dashboard");
      const [timeframe, setTimeframe] = useState("MTD");

      // Business Entities State
      const [deals, setDeals] = useState(INITIAL_DEALS);
      const [inventory, setInventory] = useState(INITIAL_INVENTORY);
      const [invoices, setInvoices] = useState(INITIAL_INVOICES);
      const [approvals, setApprovals] = useState(INITIAL_APPROVALS);
      const [auditTrail, setAuditTrail] = useState(INITIAL_AUDIT);
      const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);

      // POS State
      const [posCart, setPosCart] = useState([]);
      const [posCompletedReceipt, setPosCompletedReceipt] = useState(null);

      // HRM Attendance State
      const [clockedIn, setClockedIn] = useState(false);
      const [shiftSeconds, setShiftSeconds] = useState(0);

      // Modals and Command Palette
      const [commandPaletteOpen, setCommandPaletteOpen] = useState(false);
      const [newDealModalOpen, setNewDealModalOpen] = useState(false);
      const [auditModalDetail, setAuditModalDetail] = useState(null);
      const [toast, setToast] = useState(null);

      // Toast Notification Helper
      const showToast = useCallback((msg, type = "success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3600);
      }, []);

      // Audit Logger Helper (FR-103 System-Wide Audit Trail)
      const logAudit = useCallback((action, entity, entityId, details) => {
        const now = new Date();
        const timestamp = now.toISOString().replace("T", " ").substring(0, 19);
        const newEntry = {
          id: `AUD-${Math.floor(1000 + Math.random() * 9000)}`,
          timestamp,
          actor: role.name,
          role: role.id,
          action,
          entity,
          entityId,
          details
        };
        setAuditTrail(prev => [newEntry, ...prev]);
      }, [role]);

      // Global Keyboard Shortcut: Cmd+K / Ctrl+K
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "k") {
            e.preventDefault();
            setCommandPaletteOpen(prev => !prev);
          }
          if (e.key === "Escape") {
            setCommandPaletteOpen(false);
            setNewDealModalOpen(false);
            setPosCompletedReceipt(null);
            setAuditModalDetail(null);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      // Clock in timer tick
      useEffect(() => {
        let interval = null;
        if (clockedIn) {
          interval = setInterval(() => {
            setShiftSeconds(sec => sec + 1);
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [clockedIn]);

      // Save spec to localStorage
      useEffect(() => {
        try {
          localStorage.setItem(SPEC_STORAGE_KEY, JSON.stringify(spec));
        } catch (e) {
          console.error(e);
        }
      }, [spec]);

      // Handlers for Live App Actions
      const handleApprove = (appId) => {
        const item = approvals.find(a => a.id === appId);
        if (!item) return;
        setApprovals(prev => prev.filter(a => a.id !== appId));
        logAudit("APPROVE", item.type, item.code, `Approved ${item.title} by ${role.name}`);
        showToast(`Approved ${item.code} (${item.title})`);
      };

      const handleReject = (appId) => {
        const item = approvals.find(a => a.id === appId);
        if (!item) return;
        setApprovals(prev => prev.filter(a => a.id !== appId));
        logAudit("REJECT", item.type, item.code, `Rejected ${item.title} by ${role.name}`);
        showToast(`Rejected ${item.code}`, "error");
      };

      const handleRecordPayment = (invId) => {
        setInvoices(prev => prev.map(inv => {
          if (inv.id !== invId) return inv;
          return { ...inv, status: "Paid", paidAmount: inv.amount };
        }));
        const inv = invoices.find(i => i.id === invId);
        if (inv) {
          logAudit("PAYMENT", "Invoice", inv.number, `Received full settlement of ${formatCurrency(inv.amount, branch)} for ${inv.client}`);
          showToast(`Payment recorded for ${inv.number} (${inv.client})`);
        }
      };

      const handleCreatePOFromLowStock = (skuItem) => {
        const poNumber = `PO-2026-${Math.floor(100 + Math.random() * 900)}`;
        const reorderQty = (skuItem.reorderLevel * 2) - skuItem.inStock;
        const totalAmount = reorderQty * skuItem.costPrice;
        
        // Add pending approval
        const newApproval = {
          id: `APP-${Date.now().toString().slice(-4)}`,
          type: "Purchase Order",
          code: poNumber,
          title: `Auto-PO for ${reorderQty}x ${skuItem.name}`,
          amount: totalAmount,
          department: "Inventory",
          requester: role.name,
          date: "Just now"
        };
        setApprovals(prev => [newApproval, ...prev]);

        // Boost stock simulation
        setInventory(prev => prev.map(item => item.id === skuItem.id ? { ...item, inStock: item.inStock + reorderQty } : item));

        logAudit("CREATE", "PurchaseOrder", poNumber, `Auto-generated Purchase Order for ${reorderQty} units of ${skuItem.sku} ($${totalAmount.toLocaleString()})`);
        showToast(`Issued ${poNumber} for ${skuItem.sku}. Routed to Executive Action Inbox.`);
      };

      const handleConvertDealToInvoice = (deal) => {
        const invNumber = `INV-2026-${Math.floor(2000 + Math.random() * 8000)}`;
        const newInvoice = {
          id: invNumber,
          number: invNumber,
          client: deal.company,
          date: new Date().toISOString().split("T")[0],
          dueDate: new Date(Date.now() + 15 * 86400000).toISOString().split("T")[0],
          amount: deal.value,
          paidAmount: 0,
          status: "Pending",
          method: "Net 15"
        };
        setInvoices(prev => [newInvoice, ...prev]);
        setDeals(prev => prev.map(d => d.id === deal.id ? { ...d, stage: "Won", probability: 100 } : d));
        logAudit("CONVERT", "DealToInvoice", deal.id, `Converted proposal '${deal.name}' into invoice ${invNumber} ($${deal.value.toLocaleString()})`);
        showToast(`Converted '${deal.name}' to Invoice ${invNumber}!`);
        setActiveAppModule("finance");
      };

      const handleToggleClock = () => {
        if (!clockedIn) {
          setClockedIn(true);
          setShiftSeconds(0);
          logAudit("AUTH", "Attendance", role.name, "Clocked in for active shift");
          showToast(`Clocked in as ${role.name}. Shift timer active.`);
        } else {
          setClockedIn(false);
          const hours = (shiftSeconds / 3600).toFixed(2);
          logAudit("AUTH", "Attendance", role.name, `Clocked out after ${hours} hours (${shiftSeconds}s)`);
          showToast(`Clocked out. Logged ${hours} hours to attendance timesheet.`);
        }
      };

      const handleAddDeal = (dealData) => {
        const newDeal = {
          id: `D-${Date.now().toString().slice(-4)}`,
          ...dealData
        };
        setDeals(prev => [newDeal, ...prev]);
        logAudit("CREATE", "Deal", newDeal.id, `Created sales deal '${newDeal.name}' for ${newDeal.company} ($${newDeal.value})`);
        showToast(`Created Deal: ${newDeal.name}`);
        setNewDealModalOpen(false);
      };

      // POS Cart Handlers
      const handleAddToCart = (product) => {
        setPosCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
        showToast(`Added ${product.name} to cart`);
      };

      const handleUpdateCartQty = (productId, delta) => {
        setPosCart(prev => {
          return prev.map(item => {
            if (item.id === productId) {
              const newQty = item.qty + delta;
              return newQty > 0 ? { ...item, qty: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const handleCheckoutPOS = (paymentMethod) => {
        if (posCart.length === 0) return;
        const subtotal = posCart.reduce((acc, item) => acc + (item.unitPrice * item.qty), 0);
        const tax = subtotal * 0.0825;
        const total = subtotal + tax;
        const receiptNumber = `RCP-${Date.now().toString().slice(-6)}`;
        
        const receipt = {
          receiptNumber,
          timestamp: new Date().toLocaleString(),
          branch: branch.name,
          cashier: role.name,
          items: [...posCart],
          subtotal,
          tax,
          total,
          paymentMethod
        };

        // Deduct inventory
        setInventory(prev => prev.map(item => {
          const inCart = posCart.find(c => c.id === item.id);
          if (inCart) {
            return { ...item, inStock: Math.max(0, item.inStock - inCart.qty) };
          }
          return item;
        }));

        setPosCompletedReceipt(receipt);
        setPosCart([]);
        logAudit("CREATE", "POSOrder", receiptNumber, `Completed POS checkout of ${formatCurrency(total, branch)} via ${paymentMethod}`);
        showToast(`Order ${receiptNumber} completed! Receipt generated.`);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans transition-colors duration-200">
          {/* TOAST POPUP */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm font-semibold border animate-fade-in ${
              toast.type === "error"
                ? "bg-rose-600 text-white border-rose-400"
                : "bg-indigo-600 text-white border-indigo-400"

              <span>{toast.type === "error" ? "✕" : "✓"}</span>
              <span>{toast.msg}</span>
            </div>

          {/* TOP GLOBAL BAR */}
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-700/60 px-4 lg:px-8 py-2.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              {/* Brand & Mode Segments */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-indigo-500/30">
                  NB
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-bold">
                      NexusBMS
                    </span>
                    <span className="text-[11px] font-mono text-emerald-400 flex items-center gap-1">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      Vercel Edge Active
                    </span>
                  </div>
                  <h1 className="text-sm sm:text-base font-bold text-slate-100 flex items-center gap-2">
                    Enterprise Operating System
                  </h1>
                </div>
              </div>

              {/* View Mode Toggle: Live System vs Blueprint Spec */}
              <div className="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700/80 shadow-inner">
                <button
                  onClick={() => setAppMode("live")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                    appMode === "live"
                      ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30"
                      : "text-slate-400 hover:text-white"
                  }`}
                >
                  <span>🚀</span>
                  <span>Live BMS System</span>
                  <span className="text-[10px] px-1.5 py-0.2 rounded bg-indigo-500/40 text-indigo-100">Phase 1</span>
                </button>
                <button
                  onClick={() => setAppMode("spec")}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                    appMode === "spec"
                      ? "bg-purple-600 text-white shadow-md shadow-purple-600/30"
                      : "text-slate-400 hover:text-white"
                  }`}
                >
                  <span>📋</span>
                  <span>SRS & Roadmap Spec</span>
                </button>
              </div>

              {/* Command Palette, Branch, RBAC & Theme Controls */}
              <div className="flex items-center gap-2">
                {/* Command Palette Trigger */}
                <button
                  onClick={() => setCommandPaletteOpen(true)}
                  className="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-slate-300 transition"
                  title="Press Cmd+K or Ctrl+K"
                >
                  <span>🔍 Quick Search</span>
                  <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] font-mono text-slate-400">⌘K</kbd>
                </button>

                {/* Multi-Branch Selector (FR-102) */}
                <div className="relative group">
                  <select
                    value={branch.id}
                    onChange={(e) => {
                      const b = BRANCHES.find(x => x.id === e.target.value);
                      if (b) {
                        setBranch(b);
                        logAudit("CONFIG", "Branch", b.id, `Switched active branch context to ${b.name} (${b.currency})`);
                        showToast(`Switched branch to ${b.name}`);
                      }
                    }}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 font-medium cursor-pointer focus:outline-none focus:ring-1 focus:ring-indigo-500"
                  >
                    {BRANCHES.map(b => (
                      <option key={b.id} value={b.id}>
                        {b.flag} {b.name} ({b.currency})
                      </option>
                    ))}
                  </select>
                </div>

                {/* RBAC Role Selector (FR-101) */}
                <div className="relative">
                  <select
                    value={role.id}
                    onChange={(e) => {
                      const r = ROLES.find(x => x.id === e.target.value);
                      if (r) {
                        setRole(r);
                        logAudit("AUTH", "RoleChange", r.id, `Active role switched to ${r.name}`);
                        showToast(`Active Role: ${r.name}`);
                      }
                    }}
                    className="bg-slate-900 border border-indigo-500/50 rounded-lg px-2.5 py-1.5 text-xs text-indigo-300 font-semibold cursor-pointer focus:outline-none focus:ring-1 focus:ring-indigo-500"
                  >
                    {ROLES.map(r => (
                      <option key={r.id} value={r.id}>
                        👤 {r.name}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Dark/Light Mode Switcher */}
                <button
                  onClick={() => setIsDark(!isDark)}
                  className="p-2 rounded-lg bg-slate-900 border border-slate-700 text-slate-300 hover:text-white transition"
                  title="Toggle Theme"
                >
                  {isDark ? "☀️" : "🌙"}
                </button>

                {/* Action Inbox Alert Badge */}
                {approvals.length > 0 && (
                  <button
                    onClick={() => {
                      setAppMode("live");
                      setActiveAppModule("dashboard");
                    }}
                    className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold animate-pulse"
                    title="Pending Executive Approvals"
                  >
                    <span>🔔</span>
                    <span>{approvals.length}</span>
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN WORKSPACE BODY */}
          <div className="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8">
            {appMode === "live" ? (
              <NexusLiveAppStage
                branch={branch}
                role={role}
                activeModule={activeAppModule}
                setActiveModule={setActiveAppModule}
                timeframe={timeframe}
                setTimeframe={setTimeframe}
                deals={deals}

                onConvertDeal={handleConvertDealToInvoice}
                onToggleClock={handleToggleClock}
                onAddToCart={handleAddToCart}
                onUpdateCartQty={handleUpdateCartQty}
                onCheckoutPOS={handleCheckoutPOS}
                onOpenNewDealModal={() => setNewDealModalOpen(true)}

              />
            )}
          </div>

          {/* COMMAND PALETTE MODAL (Cmd+K) */}
          {commandPaletteOpen && (
            <CommandPaletteModal
              onClose={() => setCommandPaletteOpen(false)}
              onNavigate={(modId) => {
                setAppMode("live");
                setActiveAppModule(modId);
                setCommandPaletteOpen(false);
              }}
              onAction={(actionName) => {
                setCommandPaletteOpen(false);
                if (actionName === "new-deal") setNewDealModalOpen(true);
                if (actionName === "clock") handleToggleClock();
                if (actionName === "pos") {
                  setAppMode("live");
                  setActiveAppModule("pos");

                if (actionName === "spec") {
                  setAppMode("spec");
                }
              }}
            />

          {newDealModalOpen && (
            <NewDealModal

            <PosReceiptModal
              receipt={posCompletedReceipt}

    /* =========================================================================

        return invoices.filter(i => i.status === "Paid").reduce((acc, i) => acc + i.paidAmount, 0) + 126720;
      }, [invoices]);

      const netOperatingProfit = useMemo(() => {
        return Math.round(totalRevenue * 0.284);
      }, [totalRevenue]);

      const openReceivables = useMemo(() => {
        return invoices.filter(i => i.status !== "Paid").reduce((acc, i) => acc + (i.amount - i.paidAmount), 0);
      }, [invoices]);

      const overdueCount = useMemo(() => {
        return invoices.filter(i => i.status === "Overdue").length;
      }, [invoices]);

      const lowStockItems = useMemo(() => {
        return inventory.filter(i => i.inStock <= i.reorderLevel);
      }, [inventory]);

      const activePipelineValue = useMemo(() => {
        return deals.reduce((acc, d) => acc + (d.value * (d.probability / 100)), 0);
      }, [deals]);

      // Interactive Cashflow Data points
      const cashflowMonths = [
        { month: "Jun", rev: 110000, exp: 78000 },
        { month: "Jul", rev: 122000, exp: 84000 },
        { month: "Aug", rev: 118000, exp: 81000 },
        { month: "Sep", rev: 135000, exp: 92000 },

                <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">

      const stages = ["Lead", "Qualified", "Proposal", "Won"];

      return (
        <div className="space-y-6">

              <p className="text-xs text-slate-400 mt-1">

            <div className="flex items-center gap-3">
              <div className="text-right">
                <span className="text-[11px] text-slate-400 block">Weighted Forecast:</span>
                <span className="text-base font-bold text-emerald-400 font-mono">
                  {formatCurrency(weightedPipeline, branch)}
                </span>
              </div>
              <button
                onClick={onOpenNewDealModal}
                className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow-lg shadow-indigo-600/30"
              >
                + New Lead / Deal
              </button>
            </div>
          </div>

          {/* Kanban Pipeline Columns */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {stages.map((stg) => {
              const stageDeals = deals.filter(d => d.stage === stg);
              const stageSum = stageDeals.reduce((acc, d) => acc + d.value, 0);

              return (
                <div key={stg} className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between min-h-[460px]">

                    <div className="flex items-center justify-between border-b border-slate-800 pb-2.5 mb-3">
                      <div>
                        <span className="text-xs font-bold text-white">{stg}</span>
                        <span className="text-[11px] text-slate-400 block font-mono">
                          {formatCurrency(stageSum, branch)}
                        </span>
                      </div>
                      <span className="w-6 h-6 rounded-full bg-slate-800 flex items-center justify-center text-xs text-indigo-300 font-bold">
                        {stageDeals.length}
                      </span>
                    </div>

                    <div className="space-y-3">
                      {stageDeals.map((deal) => (
                        <div key={deal.id} className="glass-panel p-3.5 rounded-xl border border-slate-700/80 space-y-2 hover:border-indigo-500/50 transition">
                          <div className="flex justify-between items-start">

                            <span className="text-[10px] font-mono text-slate-400">{deal.probability}% Prob</span>
                          </div>
                          <h4 className="text-xs font-bold text-white">{deal.name}</h4>
                          <div className="text-[11px] text-slate-300">{deal.company}</div>
                          <div className="text-[10px] text-slate-400">{deal.contact} • {deal.email}</div>
                          <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                            <span className="text-xs font-bold text-emerald-400 font-mono">
                              {formatCurrency(deal.value, branch)}

                              <button

                                className="px-2.5 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold transition shadow"

        const secs = totalSeconds % 60;
        return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 glass-panel p-5 rounded-2xl">
            <div>
              <div className="flex items-center gap-2">

                <span className="text-xs text-slate-400">• People & Culture</span>

    function AiCopilotView({ branch, deals, inventory, invoices, approvals }) {
      const [messages, setMessages] = useState([
        { sender: "assistant", text: "Hello! I am your Antigravity AI Business Copilot. I analyze real-time CRM, Inventory, and Finance streams across all active branches. Select a prompt below or ask any question." }
      ]);
      const [inputVal, setInputVal] = useState("");

      const handleAsk = (queryText) => {
        const text = queryText || inputVal;
        if (!text.trim()) return;

        const userMsg = { sender: "user", text };
        setMessages(prev => [...prev, userMsg]);
        setInputVal("");

        // Simulate intelligent response using current state calculations
        setTimeout(() => {
          let reply = "";
          const q = text.toLowerCase();
          if (q.includes("cashflow") || q.includes("profit") || q.includes("margin")) {
            const rev = invoices.filter(i => i.status === "Paid").reduce((a, b) => a + b.paidAmount, 0) + 126720;
            const profit = Math.round(rev * 0.284);
            reply = `Financial Health Analysis: Current net revenue is ${formatCurrency(rev, branch)} with an operating profit of ${formatCurrency(profit, branch)} (28.4% margin). Cashflow trajectory is strong with zero default risk in current MTD.`;
          } else if (q.includes("inventory") || q.includes("stock") || q.includes("sku")) {
            const low = inventory.filter(i => i.inStock <= i.reorderLevel);
            reply = `Inventory Analysis: There are currently ${low.length} SKUs below minimum safety reorder thresholds: ${low.map(x => `${x.sku} (${x.name}, ${x.inStock} units left)`).join(", ")}. Recommendation: 1-click Auto-PO is ready to restock.`;
          } else if (q.includes("overdue") || q.includes("ar") || q.includes("invoice")) {
            const overdue = invoices.filter(i => i.status === "Overdue");
            const sum = overdue.reduce((a, b) => a + b.amount, 0);
            reply = `Accounts Receivable Risk: Found ${overdue.length} overdue invoices totaling ${formatCurrency(sum, branch)}. Major items: ${overdue.map(x => `${x.number} (${x.client}, ${formatCurrency(x.amount, branch)})`).join("; ")}. Automated dunning reminders are staged.`;
          } else if (q.includes("pipeline") || q.includes("deal") || q.includes("crm")) {
            const weighted = deals.reduce((a, b) => a + (b.value * (b.probability / 100)), 0);
            reply = `CRM Deal Pipeline: Total active deals: ${deals.length}. Weighted pipeline forecast value: ${formatCurrency(weighted, branch)}. High-probability conversion: ${deals.filter(d => d.stage === "Proposal").map(d => d.name).join(", ")}.`;
          } else {
            reply = `Antigravity Analysis for: "${text}"
Across ${branch.name}, all core business processes (Auth, Dashboard, CRM, Inventory, Finance, POS, HRM) are operating normally with sub-100ms response times on Vercel Edge.`;
          }
          setMessages(prev => [...prev, { sender: "assistant", text: reply }]);
        }, 500);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 glass-panel p-5 rounded-2xl">
            <div>
              <span className="text-xs font-mono uppercase text-indigo-400 font-bold">FR-901 & FR-902</span>
              <h2 className="text-xl font-bold text-white mt-0.5">Antigravity AI Business Copilot</h2>
              <p className="text-xs text-slate-400 mt-1">Natural language reasoning over operational data streams using Vercel AI SDK patterns.</p>
            </div>
          </div>

          {/* Quick Prompt Chips */}
          <div className="flex flex-wrap gap-2">
            {[
              "What is our current cashflow and operating margin?",
              "Which inventory SKUs need urgent reordering?",
              "List all overdue invoices and calculate collection risk",
              "What is our weighted CRM pipeline forecast?"
            ].map((chip, idx) => (
              <button
                key={idx}
                onClick={() => handleAsk(chip)}
                className="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-indigo-500/30 hover:border-indigo-500 text-xs text-indigo-300 font-medium transition"
              >
                💡 {chip}
              </button>
            ))}
          </div>

          {/* Chat Container */}
          <div className="glass-panel p-5 rounded-2xl space-y-4 min-h-[400px] flex flex-col justify-between">
            <div className="space-y-3 overflow-y-auto max-h-[380px] pr-2">
              {messages.map((m, idx) => (
                <div
                  key={idx}
                  className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}
                >
                  <div className={`max-w-2xl p-4 rounded-2xl text-xs leading-relaxed ${
                    m.sender === "user"
                      ? "bg-indigo-600 text-white font-medium"
                      : "bg-slate-900 border border-slate-700/80 text-slate-200"
                  }`}>
                    {m.text}
                  </div>
                </div>
              ))}
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                handleAsk();
              }}
              className="flex gap-2 pt-3 border-t border-slate-800"
            >
              <input
                type="text"
                placeholder="Ask Antigravity AI anything about revenue, inventory, margins, or deals..."
                value={inputVal}
                onChange={(e) => setInputVal(e.target.value)}

    /* =========================================================================
       LIVING SPECIFICATION STAGE (SRS & PROJECT PLAN VIEW)
       ========================================================================= */
    function NexusSpecStage(props) {
      const {
        spec, setSpec, activeTab, setActiveTab, editMode, setEditMode,
        searchQuery, setSearchQuery, selectedCategory, setSelectedCategory,
        onOpenNewModule, onLaunchApp, showToast
      } = props;

      const stats = useMemo(() => {
        const totalModules = spec.modules.length;
        const totalReqs = spec.modules.reduce((acc, m) => acc + m.requirements.length, 0);
        const mustHaveReqs = spec.modules.reduce(
          (acc, m) => acc + m.requirements.filter(r => r.priority === "Must Have").length,
          0
        );
        const totalStories = spec.modules.reduce((acc, m) => acc + m.userStories.length, 0);
        return { totalModules, totalReqs, mustHaveReqs, totalStories };
      }, [spec]);

      const categories = useMemo(() => {
        const cats = new Set(spec.modules.map(m => m.category));
        return ["All", ...Array.from(cats)];
      }, [spec.modules]);

      const filteredModules = useMemo(() => {
        return spec.modules.filter(m => {
          const matchesCat = selectedCategory === "All" || m.category === selectedCategory;
          const q = searchQuery.toLowerCase();
          const matchesQuery =
            !q ||
            m.name.toLowerCase().includes(q) ||
            m.code.toLowerCase().includes(q) ||
            m.description.toLowerCase().includes(q) ||
            m.requirements.some(r => r.title.toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
          return matchesCat && matchesQuery;
        });
      }, [spec.modules, selectedCategory, searchQuery]);

      const exportJSON = () => {
        const blob = new Blob([JSON.stringify(spec, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${spec.meta.documentCode.toLowerCase()}-spec.json`;
        a.click();
        showToast("Exported SRS JSON specification");
      };

      const copyAgentPrompt = () => {
        const promptText = `Please read the updated Business Management System (BMS) SRS & Project Plan specification below and build/update the application accordingly:

${JSON.stringify(spec, null, 2)}`;
        navigator.clipboard.writeText(promptText);
        showToast("Copied full Agent Implementation Prompt to clipboard!");
      };

      return (
        <div className="space-y-6">
          {/* Spec Header Bar */}
          <div className="glass-panel p-5 rounded-2xl flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                  {spec.meta.documentCode}
                </span>
                <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                  v{spec.meta.version} • {spec.meta.status}
                </span>
              </div>
              <h2 className="text-xl font-bold text-white mt-1">
                {spec.meta.projectName}
              </h2>
            </div>

            <div className="flex flex-wrap items-center gap-2 no-print">
              <button
                onClick={() => setEditMode(!editMode)}
                className={`px-3.5 py-2 rounded-lg text-xs font-semibold transition border ${
                  editMode
                    ? "bg-amber-500/20 text-amber-300 border-amber-500/50 ring-2 ring-amber-500/20"
                    : "bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700"
                }`}
              >
                {editMode ? "✎ Editing Active" : "✎ Edit Plan & SRS"}
              </button>

              <button
                onClick={copyAgentPrompt}
                className="px-3.5 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow shadow-indigo-600/30"
              >
                ⚡ Copy Spec for Antigravity
              </button>

              <button
                onClick={exportJSON}
                className="px-3 py-2 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                Export JSON
              </button>

              <button
                onClick={() => {
                  if (confirm("Reset SRS specification and roadmap to latest server-deployed state?")) {
                    setSpec(INITIAL_SPEC_DATA);
                    try {
                      localStorage.setItem(SPEC_STORAGE_KEY, JSON.stringify(INITIAL_SPEC_DATA));
                      localStorage.removeItem("NEXUS_BMS_SRS_SPEC_V1");
                      localStorage.removeItem("NEXUS_BMS_SRS_SPEC_V2");
                    } catch (e) {}
                    showToast("Reset to latest server-deployed specifications!");

                }}
                className="px-3 py-2 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"

              { id: "roadmap", label: "2. Master Project Plan & Roadmap" },
              { id: "srs", label: `3. Functional SRS Modules (${stats.totalModules})` },
              { id: "architecture", label: "4. Architecture & ER Schema" },
              { id: "agent", label: "5. Antigravity Agent Directives" }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                  activeTab === tab.id
                    ? "bg-indigo-600/20 text-indigo-300 border border-indigo-500/40 font-bold"
                    : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Tab 1: Overview */}
          {activeTab === "overview" && (
            <div className="space-y-6">
              <div className="glass-panel rounded-2xl p-6 space-y-4">
                <h3 className="text-base font-bold text-white">1.1 Executive Vision</h3>
                <p className="text-sm text-slate-300 leading-relaxed bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                  {spec.executiveSummary.vision}
                </p>

                <div className="grid md:grid-cols-2 gap-4 pt-2">
                  <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-800">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-2">Strategic Objectives</h4>
                    <ul className="space-y-2 text-xs text-slate-300">
                      {spec.executiveSummary.objectives.map((obj, i) => (
                        <li key={i} className="flex items-start gap-2">
                          <span className="text-indigo-400 font-bold">0{i+1}.</span>
                          <span>{obj}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-800">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">Agent Directive</h4>
                    <p className="text-xs text-slate-300 leading-relaxed">{spec.meta.agentDirective}</p>
                    <div className="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-400">
                      Target Audience: <strong className="text-slate-200">{spec.executiveSummary.targetAudience}</strong>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Tab 2: Roadmap */}
          {activeTab === "roadmap" && (
            <div className="space-y-4">
              <div className="glass-panel rounded-2xl p-6 space-y-4">
                <h3 className="text-lg font-bold text-white">Implementation Roadmap & Delivery Milestones</h3>
                <div className="space-y-4">
                  {spec.roadmapPhases.map((phase) => (
                    <div key={phase.id} className="bg-slate-900/70 border border-slate-800 rounded-xl p-5 space-y-3">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-mono px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-bold border border-indigo-500/30">
                            {phase.id}
                          </span>
                          <h4 className="text-sm font-bold text-white">{phase.phase}</h4>
                        </div>
                        <div className="flex items-center gap-2 text-xs">
                          <span className="text-slate-400">{phase.duration}</span>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            phase.progress === 100 ? "bg-emerald-500/20 text-emerald-300" : "bg-indigo-500/20 text-indigo-300"
                          }`}>
                            {phase.status} ({phase.progress}%)
                          </span>
                        </div>
                      </div>

                      <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                        <div className={`${phase.progress === 100 ? "bg-emerald-500" : "bg-indigo-500"} h-2 rounded-full transition-all duration-500`} style={{ width: `${phase.progress}%` }}></div>
                      </div>

                      <div className="grid sm:grid-cols-2 gap-2 pt-2">
                        {phase.deliverables.map((del, dIdx) => (
                          <div key={dIdx} className="text-xs text-slate-300 flex items-start gap-1.5">
                            <span className="text-emerald-400 font-bold">✓</span>
                            <span>{del}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Tab 3: SRS Modules */}
          {activeTab === "srs" && (
            <div className="space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder="Search module or requirement ID..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 w-64"
                  />
                  <select
                    value={selectedCategory}
                    onChange={(e) => setSelectedCategory(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white"
                  >
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <button
                  onClick={onOpenNewModule}
                  className="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition shadow"
                >
                  + Add SRS Module
                </button>
              </div>

              <div className="space-y-4">
                {filteredModules.map((mod) => (
                  <div key={mod.id} className="glass-panel p-5 rounded-2xl border border-slate-700/80 space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-mono px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-bold border border-indigo-500/30">
                          {mod.code}
                        </span>
                        <h4 className="text-base font-bold text-white">{mod.name}</h4>
                        <span className="text-[10px] text-slate-400">({mod.category})</span>
                      </div>
                      <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-bold">
                        {mod.status}
                      </span>
                    </div>

                    <p className="text-xs text-slate-300">{mod.description}</p>

                    <div>
                      <h5 className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Functional Requirements</h5>
                      <div className="space-y-2">
                        {mod.requirements.map(req => (
                          <div key={req.id} className="bg-slate-900/90 border border-slate-800 p-3 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-mono text-indigo-400 font-bold text-xs">{req.id}</span>
                                <span className="text-xs font-semibold text-white">{req.title}</span>
                              </div>
                              <p className="text-[11px] text-slate-400 mt-0.5">{req.acceptance}</p>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded bg-slate-800 text-slate-300 text-[10px]">{req.complexity}</span>
                              <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-bold">{req.priority}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Tab 4: Architecture */}
          {activeTab === "architecture" && (
            <div className="space-y-6">
              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <h3 className="text-lg font-bold text-white">System Architecture & Relational Entities</h3>
                <div className="grid md:grid-cols-2 gap-4">
                  {Object.entries(spec.architecture).map(([key, val]) => (
                    <div key={key} className="bg-slate-900/70 border border-slate-800 p-4 rounded-xl">
                      <span className="text-xs font-mono uppercase text-indigo-400 font-bold">{key}</span>
                      <p className="text-xs text-slate-200 mt-1 font-medium">{val}</p>
                    </div>
                  ))}
                </div>

                <h4 className="text-base font-bold text-white pt-4">Data Entities & Relationships</h4>
                <div className="grid md:grid-cols-2 gap-3">
                  {spec.dataEntities.map((ent, idx) => (
                    <div key={idx} className="bg-slate-900/70 border border-slate-800 p-3.5 rounded-xl space-y-1">
                      <span className="text-xs font-bold text-white">{ent.entity}</span>
                      <div className="text-[11px] font-mono text-indigo-300">{ent.keyFields}</div>
                      <div className="text-[11px] text-slate-400">{ent.relationships}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Tab 5: Agent Directives */}
          {activeTab === "agent" && (
            <div className="glass-panel p-6 rounded-2xl space-y-4">
              <h3 className="text-lg font-bold text-white">Google Antigravity Agent Spec-Driven Workflow</h3>
              <p className="text-xs text-slate-300 leading-relaxed">
                This web application acts as both the executable software and the living engineering specification.
                Whenever requirements or phases are modified, Google Antigravity inspects this document and executes the corresponding implementation.
              </p>
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-mono text-indigo-400">Specification Snapshot</span>
                  <button onClick={copyAgentPrompt} className="text-xs text-indigo-400 hover:underline">Copy Prompt</button>
                </div>
                <pre className="text-[11px] font-mono text-slate-300 overflow-x-auto max-h-60 p-3 bg-slate-900/80 rounded-lg">
                  {JSON.stringify(spec, null, 2)}
                </pre>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =========================================================================
       MODALS: COMMAND PALETTE, NEW DEAL, POS RECEIPT, AUDIT DIFF
       ========================================================================= */
    function CommandPaletteModal({ onClose, onNavigate, onAction }) {
      const [query, setQuery] = useState("");

      const COMMANDS = [
        { id: "dashboard", label: "Executive Dashboard", group: "Navigate", icon: "📊" },
        { id: "crm", label: "CRM & Sales Pipeline", group: "Navigate", icon: "🤝" },
        { id: "inventory", label: "ERP Inventory Catalog", group: "Navigate", icon: "📦" },
        { id: "finance", label: "Finance & Accounts Receivable", group: "Navigate", icon: "💳" },
        { id: "pos", label: "Web POS Checkout Terminal", group: "Navigate", icon: "🛒" },
        { id: "hrm", label: "HRM & Shift Punch Clock", group: "Navigate", icon: "👥" },
        { id: "audit", label: "System-Wide Audit Trail", group: "Navigate", icon: "🛡️" },
        { id: "copilot", label: "Antigravity AI Copilot", group: "Navigate", icon: "🤖" },
        { id: "new-deal", label: "Create New Customer Deal", group: "Action", icon: "⚡" },
        { id: "clock", label: "Toggle Attendance Clock-In", group: "Action", icon: "⏱️" },
        { id: "spec", label: "View Living SRS Blueprint", group: "Spec", icon: "📋" },
      ];

      const filtered = COMMANDS.filter(c => c.label.toLowerCase().includes(query.toLowerCase()));

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-start justify-center pt-20 p-4 animate-fade-in">
          <div className="glass-panel rounded-2xl max-w-lg w-full border border-slate-700 shadow-2xl overflow-hidden">
            <div className="p-3 border-b border-slate-700/80 flex items-center gap-2">
              <span className="text-slate-400">🔍</span>
              <input
                autoFocus
                type="text"
                placeholder="Type a command or jump to module..."
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                className="w-full bg-transparent text-sm text-white focus:outline-none placeholder-slate-500"
              />
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xs px-2">ESC</button>
            </div>

            <div className="max-h-80 overflow-y-auto p-2 space-y-1">
              {filtered.map(cmd => (
                <div
                  key={cmd.id}
                  onClick={() => {
                    if (cmd.group === "Navigate") onNavigate(cmd.id);
                    else onAction(cmd.id);
                  }}
                  className="p-2.5 rounded-xl hover:bg-indigo-600/20 hover:text-indigo-300 text-slate-200 text-xs font-semibold flex items-center justify-between cursor-pointer transition"
                >
                  <span className="flex items-center gap-2">
                    <span>{cmd.icon}</span>
                    <span>{cmd.label}</span>
                  </span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">{cmd.group}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function NewDealModal({ onClose, onSave }) {
      const [name, setName] = useState("");
      const [company, setCompany] = useState("");
      const [contact, setContact] = useState("");
      const [email, setEmail] = useState("");
      const [value, setValue] = useState(15000);
      const [stage, setStage] = useState("Qualified");

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || !company) return;
        onSave({
          name,
          company,
          contact: contact || "Lead Contact",
          email: email || "info@client.com",
          value: Number(value),
          stage,
          probability: stage === "Lead" ? 20 : stage === "Qualified" ? 40 : stage === "Proposal" ? 70 : 100
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="glass-panel rounded-2xl p-6 max-w-md w-full space-y-4 border border-slate-700">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <h3 className="font-bold text-white text-base">+ New CRM Deal Opportunity</h3>
              <button type="button" onClick={onClose} className="text-slate-400 hover:text-white text-sm">✕</button>
            </div>

            <div>
              <label className="text-xs text-slate-400 block mb-1">Deal Title *</label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="e.g. Fleet GPS Tracking Integration"
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
              />
            </div>

            <div>
              <label className="text-xs text-slate-400 block mb-1">Company / Organization *</label>
              <input
                type="text"
                required
                value={company}
                onChange={(e) => setCompany(e.target.value)}
                placeholder="e.g. Apex Global Corp"
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
              />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs text-slate-400 block mb-1">Contact Person</label>
                <input
                  type="text"
                  value={contact}
                  onChange={(e) => setContact(e.target.value)}
                  placeholder="e.g. Sarah Connor"
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
                />
              </div>
              <div>
                <label className="text-xs text-slate-400 block mb-1">Estimated Value ($)</label>
                <input
                  type="number"
                  value={value}
                  onChange={(e) => setValue(e.target.value)}
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono"
                />
              </div>
            </div>

            <div>
              <label className="text-xs text-slate-400 block mb-1">Pipeline Stage</label>
              <select
                value={stage}
                onChange={(e) => setStage(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"
              >
                <option value="Lead">Lead Capture (20%)</option>
                <option value="Qualified">Qualified Prospect (40%)</option>
                <option value="Proposal">Proposal / Quote Sent (70%)</option>
                <option value="Won">Closed Won (100%)</option>
              </select>
            </div>

            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-3 py-2 rounded-lg text-xs text-slate-400 hover:text-white">
                Cancel
              </button>
              <button type="submit" className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">
                Save Deal
              </button>
            </div>
          </form>
        </div>
      );
    }

    function PosReceiptModal({ receipt, branch, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
          <div className="bg-white text-slate-900 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl font-mono text-xs">
            <div className="text-center border-b border-dashed border-slate-300 pb-3">
              <div className="font-extrabold text-sm uppercase">NEXUSBMS OMNICHANNEL POS</div>
              <div className="text-[10px] text-slate-600">{receipt.branch}</div>
              <div className="text-[10px] text-slate-500 mt-1">{receipt.timestamp}</div>
              <div className="text-[10px] text-slate-500">Receipt #: {receipt.receiptNumber}</div>
              <div className="text-[10px] text-slate-500">Cashier: {receipt.cashier}</div>
            </div>

            <div className="space-y-1.5 border-b border-dashed border-slate-300 pb-3">
              {receipt.items.map((it, idx) => (
                <div key={idx} className="flex justify-between">
                  <span>{it.qty}x {it.name.substring(0, 20)}</span>
                  <span>{formatCurrency(it.unitPrice * it.qty, branch)}</span>
                </div>
              ))}
            </div>

            <div className="space-y-1 border-b border-dashed border-slate-300 pb-3">
              <div className="flex justify-between">
                <span>Subtotal:</span>
                <span>{formatCurrency(receipt.subtotal, branch)}</span>
              </div>
              <div className="flex justify-between text-slate-600">
                <span>Tax (8.25%):</span>
                <span>{formatCurrency(receipt.tax, branch)}</span>
              </div>
              <div className="flex justify-between font-bold text-sm pt-1">
                <span>TOTAL PAID:</span>
                <span>{formatCurrency(receipt.total, branch)}</span>
              </div>
              <div className="text-[10px] text-slate-500 text-right">Method: {receipt.paymentMethod}</div>
            </div>

            <div className="text-center text-[10px] text-slate-500 space-y-1">
              <div>Thank you for your business!</div>
              <div>NexusBMS Enterprise POS • Verified Edge Transaction</div>
            </div>

            <div className="flex gap-2 pt-2 no-print">
              <button
                onClick={() => window.print()}
                className="flex-1 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs"
              >
                🖨️ Print Receipt
              </button>
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AuditDetailModal({ auditItem, onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
          <div className="glass-panel rounded-2xl p-6 max-w-lg w-full space-y-4 border border-slate-700">
            <div className="flex justify-between items-center border-b border-slate-800 pb-3">
              <div>
                <span className="text-xs font-mono text-indigo-400 font-bold">{auditItem.id}</span>
                <h3 className="font-bold text-white text-base">Forensic Audit Payload Inspection</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="space-y-2 text-xs">
              <div className="flex justify-between">
                <span className="text-slate-400">Timestamp:</span>
                <span className="font-mono text-slate-200">{auditItem.timestamp}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">Actor Identity:</span>
                <span className="font-semibold text-white">{auditItem.actor} ({auditItem.role})</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">Action Type:</span>
                <span className="font-mono text-indigo-400 font-bold">{auditItem.action}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-slate-400">Entity Affected:</span>
                <span className="font-mono text-emerald-400">{auditItem.entity} ({auditItem.entityId})</span>
              </div>
              <div className="pt-2">
                <span className="text-slate-400 block mb-1">Audit Details:</span>
                <p className="bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-slate-200 leading-relaxed font-mono">
                  {auditItem.details}
                </p>
              </div>
            </div>

            <div className="flex justify-end pt-2">
              <button onClick={onClose} className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">
                Close Inspector
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<NexusRoot />);
  </script>
</body>
</html>
